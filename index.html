body::before{
    content:"";

    background:
        radial-gradient(circle at 50% 0%,rgba(0,140,255,.28),transparent 35%),

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    opacity:.25;
    background-image:radial-gradient(#42aaff 1px,transparent 1px);
    background-size:55px 55px;
    animation:stars 20s linear infinite;
    pointer-events:none;
}

@keyframes stars{
    from{background-position:0 0}
    to{background-position:550px 550px}
