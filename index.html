<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PrimeMC | Minecraft</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      overflow-x: hidden;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(0, 119, 255, 0.30),
          transparent 45%
        ),
        linear-gradient(
          135deg,
          #020617,
          #061a40,
          #020617
        );
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .logo {
      width: min(600px, 85vw);
      max-height: 300px;
      object-fit: contain;

      filter:
        drop-shadow(0 0 20px rgba(0, 119, 255, 0.45))
        drop-shadow(0 0 50px rgba(0, 119, 255, 0.20));

      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .hero p {
      margin-top: 20px;
      font-size: 20px;
      color: #b9d9ff;
    }

    .buttons {
      display: flex;
      gap: 15px;
      margin-top: 35px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .button {
      padding: 15px 28px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      font-weight: bold;

      background: #087cff;
      box-shadow: 0 0 25px rgba(0, 119, 255, 0.35);

      transition: 0.25s;
    }

    .button:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 40px rgba(0, 119, 255, 0.65);
    }

    .button.secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .ip {
      margin-top: 25px;
      padding: 12px 20px;

      border-radius: 8px;
      background: rgba(0, 0, 0, 0.25);

      color: #65b9ff;
      font-family: monospace;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <section class="hero">

    <img
      src="primemclogo.png"
      alt="PrimeMC Logo"
      class="logo"
    >

    <p>Welcome to the PrimeMC community.</p>

    <div class="buttons">

      <a
        class="button"
        href="https://discord.gg/e"
        target="_blank"
      >
        Join Discord
      </a>

      <a
        class="button secondary"
        href="#about"
      >
        Explore
      </a>

    </div>

    <div class="ip">
      play.primemc.fun
    </div>

  </section>

</body>
</html>
